<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1230">
<title>Vertido</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <div class="lvl">Nivel <span id="lvl">1</span><small id="streak"></small></div>
  <div class="coins"><i></i><span id="coins">0</span></div>
</header>
<div id="board" aria-label="Tablero"></div>
<div class="tools">
  <button class="tool" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Deshacer<span id="undoN">3</span></button>
  <button class="tool" id="bHint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg>Pista<span id="hintN">20</span></button>
  <button class="tool" id="bTube"><svg viewBox="0 0 24 24"><path d="M8 3h8M9 3v12a3 3 0 0 0 6 0V3"/><path d="M12 8v3M10.5 9.5h3"/></svg>Frasco<span id="tubeN">30</span></button>
  <button class="tool" id="bRestart"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reiniciar<span>gratis</span></button>
</div>
<div class="overlay" id="win"><div class="card"><h2>Resuelto</h2><p id="winMsg"></p><span class="big" id="winCoins"></span><button class="btn" id="bDouble">Doblar monedas (ver anuncio)</button><button class="btn ghost" id="bNext">Siguiente nivel</button></div></div>
<div class="overlay" id="stuckO"><div class="card"><h2>Sin movimientos</h2><p>No hay vertidos válidos.</p><button class="btn" id="bStuckUndo">Deshacer</button><button class="btn" id="bStuckTube">Frasco extra</button><button class="btn ghost" id="bStuckRestart">Reiniciar</button></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="../src/game/main.js"></script>
</body>
</html>
